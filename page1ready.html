<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Catchub - Watch. Communicate. Create.</title>
        <link rel="icon" href="assets/favicon.jpg">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <section class="hero">
            <div class="hero-inner">

                <!-- Left Container -->
                <div class="hero-copy">

                    <img
                        class="brand"
                        src="assets/logo.png"
                        alt="Catchub">

                    <p class="tagline">
                        WATCH. COMMUNICATE. CREATE.
                    </p>

                    <p class="subtagline">
                        Everything you need to socialise
                    </p>

                    <!--  App Download Buttons -->
                    <div class="store-links">

                        <a href="#" aria-label="Available on Android">
                            <img
                                src="assets/play_store.png"
                                alt="Available on Android">
                        </a>

                        <a href="#" aria-label="Download on Apple App Store">
                            <img
                                src="assets/app_store.png"
                                alt="Available on Apple App Store">
                        </a>

                    </div>
                </div>

                <!-- Right Container -->
                <div class="hero-art">

                    <img
                        src="assets/top_screens.png"
                        alt="Catchub mobile application screenshots">

                </div>

            </div>
        </section>

        <section class="channel-section">
            <div class="channel-inner">
                <div class="image-box">
                    <img src="assets/sec_screens.png"
                        alt="Catchub channel screens">
                </div>

                <div class="text-box">
                    <h2 class="main-heading">CHANNELS</h2>
                    <p class="first-line">Enjoy the videos and music you love.
                    </p>
                    <p class="second-line">Create your own business</p>
                    <p class="third-line">or entertainment channel.</p>
                </div>

            </div>

        </section>

    </body>
</html>
